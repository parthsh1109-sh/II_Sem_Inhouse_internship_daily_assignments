<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student CGPA Viewer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="hero-grid" aria-label="Dashboard header">
      <aside class="institute-card" aria-label="Institute logo">
        <img class="institute-logo" src="assets/corner-logo.png" alt="SKIT logo">
      </aside>

      <div class="hero-copy">
        <p class="eyebrow">Class Dashboard</p>
        <h1>Student CGPA Viewer</h1>
        <p class="subtitle">Search students quickly and reveal CGPA only when needed.</p>
      </div>
    </section>

    <section class="toolbar" aria-label="Student search">
      <label class="search-box" for="studentSearch">
        <svg aria-hidden="true" viewBox="0 0 24 24">
          <path d="m21 21-4.35-4.35"></path>
          <circle cx="11" cy="11" r="7"></circle>
        </svg>
        <input id="studentSearch" type="search" placeholder="Search student or branch">
      </label>
    </section>

    <section class="summary" aria-label="Class summary">
      <div>
        <span id="visibleCount">0</span>
        <p>Students shown</p>
      </div>
      <div>
        <span>30</span>
        <p>Total records</p>
      </div>
    </section>

    <section class="student-panel" aria-label="Student list">
      <div class="table-head">
        <span>Name</span>
        <span>Branch</span>
        <span>CGPA</span>
        <span>Action</span>
      </div>
      <div id="studentList" class="student-list"></div>
      <p id="emptyState" class="empty-state" hidden>No matching student found.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
