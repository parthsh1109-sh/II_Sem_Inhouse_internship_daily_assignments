<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Counter App</title>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Verdana, Geneva, Tahoma, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff9a44,#fc6076);
    transition:.4s;
}

.container-box{
    width:400px;
    background:#fffdf8;
    padding:35px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 15px 35px rgba(0,0,0,.25);
    transition:.3s;
}

.container-box:hover{
    transform:translateY(-10px);
}

h1{
    color:#ff5722;
    margin-bottom:20px;
    font-weight:bold;
}

#count{
    font-size:72px;
    color:#d63384;
    font-weight:bold;
    margin:25px 0;
}

.btn{
    border-radius:30px;
    font-weight:bold;
    transition:.3s;
}

.btn:hover{
    transform:scale(1.06);
}

.dark-mode{
    background:linear-gradient(135deg,#232526,#414345);
}

.dark-mode .container-box{
    background:#2d3436;
    color:white;
}

.dark-mode h1{
    color:#ffd166;
}

.dark-mode #count{
    color:#00e5a8;
}

</style>

</head>
<body>

<div class="container-box">

<h1>Counter App</h1>

<h2 id="count">0</h2>

<div class="d-grid gap-3">

<button class="btn btn-primary" id="plus">
➕ Increment
</button>

<button class="btn btn-danger" id="minus">
➖ Decrement
</button>

<button class="btn btn-warning" id="reset">
🔄 Reset
</button>

<button class="btn btn-secondary" id="mode">
🌙 Dark Mode
</button>

</div>

</div>

<script>

let count = 0;

$("#plus").click(function(){

    count++;

    $("#count").text(count);

});

$("#minus").click(function(){

    count--;

    $("#count").text(count);

});

$("#reset").click(function(){

    count = 0;

    $("#count").text(count);

});

$("#mode").click(function(){

    $("body").toggleClass("dark-mode");

    if($("body").hasClass("dark-mode")){

        $(this)
        .removeClass("btn-secondary")
        .addClass("btn-light")
        .text("☀️ Light Mode");

    }

    else{

        $(this)
        .removeClass("btn-light")
        .addClass("btn-secondary")
        .text("🌙 Dark Mode");

    }

});

</script>

</body>
</html>
