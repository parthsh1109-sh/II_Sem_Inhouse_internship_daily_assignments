<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Finder</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-expand-lg navbar-dark bg-success shadow-lg">
    <div class="container">

        <a class="navbar-brand fw-bold" href="#">
            <i class="bi bi-person-lines-fill me-2"></i>
            Student Finder
        </a>

        <button class="navbar-toggler"
            data-bs-toggle="collapse"
            data-bs-target="#menu">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="menu">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link active" href="#">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#students">Students</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#contact">Contact</a>
                </li>

            </ul>

        </div>

    </div>
</nav>

<!-- ================= HERO ================= -->

<section class="py-5 text-center text-white"
style="background:linear-gradient(135deg,#198754,#20c997);">

<div class="container">

<h1 class="display-4 fw-bold">
Student Finder Portal
</h1>

<p class="lead">
Find students quickly using Name,
Department or CGPA filters.
</p>

</div>

</section>

<!-- ================= FILTER ================= -->

<section class="py-5">

<div class="container">

<div class="row g-3">

<div class="col-lg-4">

<input
type="text"
id="searchName"
class="form-control shadow-sm"
placeholder="Search Student">

</div>

<div class="col-lg-4">

<select
class="form-select shadow-sm"
id="departmentFilter">

<option value="All">All Departments</option>
<option value="CSE">Computer Science</option>
<option value="IT">Information Technology</option>
<option value="AI">Artificial Intelligence</option>
<option value="ECE">Electronics</option>
<option value="Mechanical">Mechanical</option>

</select>

</div>

<div class="col-lg-4">

<select
class="form-select shadow-sm"
id="cgpaFilter">

<option value="All">All CGPA</option>
<option value="9">9+</option>
<option value="8">8+</option>
<option value="7">7+</option>
<option value="6">6+</option>

</select>

</div>

</div>

</div>

</section>

<!-- ================= STUDENTS ================= -->

<section id="students" class="pb-5">

<div class="container">

<div class="row g-4"
id="studentContainer">

<!-- Cards from jQuery -->

</div>

</div>

</section>

<!-- ================= MODAL ================= -->

<div class="modal fade"
id="studentModal"
tabindex="-1">

<div class="modal-dialog modal-lg">

<div class="modal-content rounded-4">

<div class="modal-header bg-success text-white">

<h5 class="modal-title">

Student Information

</h5>

<button
class="btn-close btn-close-white"
data-bs-dismiss="modal">
</button>

</div>

<div class="modal-body">

<div id="studentDetails">

</div>

</div>

</div>

</div>

</div>

<!-- ================= CONTACT ================= -->

<section
id="contact"
class="py-5 bg-light">

<div class="container">

<h2 class="text-center mb-4">
Contact Us
</h2>

<div class="row justify-content-center">

<div class="col-lg-6">

<form>

<div class="mb-3">

<input
type="text"
class="form-control"
placeholder="Full Name">

</div>

<div class="mb-3">

<input
type="email"
class="form-control"
placeholder="Email Address">

</div>

<div class="mb-3">

<textarea
class="form-control"
rows="4"
placeholder="Write your message"></textarea>

</div>

<button
class="btn btn-success w-100">

Send Message

</button>

</form>

</div>

</div>

</div>

</section>

<!-- ================= FOOTER ================= -->

<footer class="bg-success text-white text-center p-3">

<p class="mb-0">

© 2026 Student Finder | All Rights Reserved

</p>

</footer>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<!-- Custom JS -->
<script src="script.js"></script>

</body>
</html>
